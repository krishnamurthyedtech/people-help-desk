spring.application.name=application_data
server.port=8080

# Database configuration (H2 in PostgreSQL compatibility mode for local standalone run)
spring.datasource.url=jdbc:h2:file:./data/application_data;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Path matching strategy (optional, default is AntPathMatcher)
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

logging.level.org.springframework.web=DEBUG
logging.file.name=myapp.log
